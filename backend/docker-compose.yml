# ⚠️ Uso exclusivo para desenvolvimento local (Laravel Sail).
# Não usar como base para deploy em produção — ver README.md (seção Docker).

services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
    pgsql:
        image: 'postgres:17-alpine'
        ports:
            # Só na máquina local (127.0.0.1): com a senha padrão do .env.example, publicar em
            # 0.0.0.0 deixaria o banco acessível a qualquer um na mesma rede (ex.: Wi-Fi público).
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        # Sessões do BFF (frontend): o JWT de acesso fica AQUI, nunca no navegador (SEC-009).
        # Só para desenvolvimento: sem volume e sem gravar em disco (--save "" --appendonly no).
        # Assim nunca lê um arquivo de dados antigo ou de outra versão do Redis (o que fazia o
        # container sair com "Can't handle RDB format version") e reiniciar só desloga os usuários
        # de teste. Porta só em 127.0.0.1. Em produção: senha, TLS, rede privada (docs/seguranca.md).
        image: 'redis:7-alpine'
        command: ['redis-server', '--save', '', '--appendonly', 'no']
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
